<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Mua Bán Gmail New VN</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#f2f4f8;
}

/* ===== HERO TEXT ===== */
.hero{
    background:linear-gradient(135deg,#020024,#005cff,#00c6ff);
    color:#fff;
    padding:80px 20px 60px;
    text-align:center;
}

.hero h1{
    font-size:42px;
    font-weight:800;
}
.hero h1 span{color:#ffd000}

.hero p{
    font-size:18px;
    margin:12px 0 30px;
}

/* CTA */
.hero-actions a{
    display:inline-block;
    margin:8px;
    padding:14px 30px;
    border-radius:30px;
    color:#fff;
    text-decoration:none;
    font-weight:bold;
}
.zalo{background:#0068ff}
.tele{background:#229ED9}

/* ===== FORM MUA ===== */
.buy-box{
    max-width:420px;
    margin: -40px auto 40px;
    background:#fff;
    padding:25px;
    border-radius:14px;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.buy-box h2{
    margin-top:0;
    text-align:center;
    color:#005cff;
}

.buy-box input,
.buy-box textarea{
    width:100%;
    padding:12px;
    margin-top:10px;
    border-radius:8px;
    border:1px solid #ccc;
}

.buy-box button{
    width:100%;
    margin-top:16px;
    padding:14px;
    border:none;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    color:#fff;
    background:linear-gradient(135deg,#0066ff,#00c6ff);
    cursor:pointer;
    animation:pulse 1.6s infinite;
}

@keyframes pulse{
    50%{transform:scale(1.05)}
}
</style>
</head>

<body>

<!-- HERO -->
<div class="hero">
    <h1>MUA BÁN <span>GMAIL NEW VN</span></h1>
    <p>Uy tín – Gmail New 100% – Nhận đơn tự động</p>

    <div class="hero-actions">
        <a href="#buy" class="zalo">🛒 MUA NGAY</a>
        <a href="https://t.me/railink36vip" class="tele">📲 Telegram</a>
    </div>
</div>

<!-- FORM MUA -->
<div class="buy-box" id="buy">
    <h2>🛒 ĐẶT HÀNG</h2>

    <form id="orderForm">
        <input type="number" id="quantity" min="1" value="1" required>
        <textarea id="note" placeholder="Ghi chú (nếu có)"></textarea>
        <button type="submit">🚀 ĐẶT HÀNG NGAY</button>
    </form>
</div>

<script>
document.addEventListener("DOMContentLoaded", function(){

const BOT_TOKEN = "8430476587:XXXXXXXXXXXX";
const CHAT_ID  = "7057405772";

document.getElementById("orderForm").addEventListener("submit", function(e){
    e.preventDefault();

    const qty = Number(document.getElementById("quantity").value);
    const note = document.getElementById("note").value || "Không có";
    const orderId = "GM" + Date.now();
    const price = qty * 8000;

    const text =
`🔥 ĐƠN HÀNG MỚI
🆔 Mã đơn: ${orderId}
📦 Gmail New VN
🔢 Số lượng: ${qty}
💰 Giá: ${price.toLocaleString()} VND
📝 Ghi chú: ${note}
🌐 Nguồn: Website`;

    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            chat_id:CHAT_ID,
            text:text
        })
    }).then(r=>r.json()).then(d=>{
        if(d.ok){
            alert("✅ Đặt hàng thành công! Shop sẽ liên hệ.");
            document.getElementById("orderForm").reset();
        }else{
            alert("❌ Gửi đơn thất bại");
        }
    });
});
});
</script>

</body>
</html>
